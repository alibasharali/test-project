name: Claude Code

# `@claude <request>` in an issue, PR comment or review thread runs Claude on the branch, for the
# repo owner only.
# Managed by Software Factory's agent kit; change it in the kit, not here.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # only the repo's owner (factory projects live on the developer's own account): anyone else's
    # @claude, in a comment, review or issue, never runs Claude with this repo's secrets
    if: |
      github.actor == github.repository_owner && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: npm

      - if: hashFiles('package-lock.json') != ''
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(.claude/check.sh),Bash(npm ci:*),Bash(npm test:*),Bash(npm run:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Follow CLAUDE.md, .claude/rules/ and docs/agents/workflow.md. Hard rules from docs/agents/review-policy.md: never change a test to make it pass; never edit the spec in docs/specs/, .github/workflows/, .claude/settings.json or .claude/hooks/. If the request needs that, explain why and stop. Run .claude/check.sh before pushing. Commit with a descriptive message, not prefixed fix(review):, so the review runs again. When you answer a review thread, say what you changed with the commit SHA, and remind the human to resolve the thread."
